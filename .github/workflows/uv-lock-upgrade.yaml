# Action to run uv lock monthly and create a Pull Request with the changes.
# This keeps dependencies up-to-date by updating uv.lock with the latest
# compatible versions from pyproject.toml.

name: Update dependencies with uv

on:
  schedule:
    # Run monthly
    - cron: "0 0 1 * *"

permissions:
  contents: read

jobs:
  update-dependencies:
    permissions:
      contents: write # to create branch (peter-evans/create-pull-request)
      pull-requests: write # to create a PR (peter-evans/create-pull-request)

    name: Update dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # https://docs.astral.sh/uv/guides/integration/github/
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          # Install a specific version of uv.
          version: "0.11.1"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install "pg_config" requirement
        run: sudo apt-get install libpq-dev

      # Update packages where the new version has been out at least 2 weeks
      # https://docs.astral.sh/uv/reference/cli/#uv-lock--exclude-newer
      - name: Update dependencies with uv lock
        # Capture the output of `uv lock` to a file so we can include it in the PR description.
        # Running `uv sync` afterwards removes the "excludes-newer" block from uv.lock,
        # while still keeping the updated versions of the dependencies.
        run: |
          uv lock --upgrade --exclude-newer "$(date -I -d '-2 weeks')" 2>&1 | tee "${{ runner.temp }}/uv-lock-output.txt"
          uv sync

      - name: Create PR description
        run: |
          {
            echo "Dependencies: all packages updated via uv lock"
            echo ""
            echo 'This PR updates the `uv.lock` file with the latest compatible versions'
            echo 'of all dependencies specified in `pyproject.toml`.'
            echo ""
            echo "<details>"
            echo "<summary>Updated dependencies</summary>"
            echo ""
            echo '```text'
            cat "${{ runner.temp }}/uv-lock-output.txt"
            echo '```'
            echo ""
            echo "</details>"
          } > "${{ runner.temp }}/pr-body.md"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          add-paths: |
            uv.lock
          title: |
            Dependencies: all packages updated via uv lock
          body-path: ${{ runner.temp }}/pr-body.md
          commit-message: |
            Dependencies: all packages updated via uv lock
          delete-branch: true
          branch: dependencies/uv-lock
          branch-suffix: short-commit-hash
